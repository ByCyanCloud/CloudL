name: Release

# 打标签即发布：git tag v0.1.0 && git push origin v0.1.0
# 版本号由 MinVer 依据 tag 计算，因此必须以 v* 形式打标签。
on:
  push:
    tags: [ 'v*' ]
  # 手动触发必须显式指定一个已存在的 v* 标签。
  # 否则 MinVer 会算出 0.1.x-preview.N 这类预览版本，并真的推送到 nuget.org（不可撤销）。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在标签（例如 v0.2.0）'
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: 校验并发布到 nuget.org
    runs-on: ubuntu-latest

    # Trusted Publishing 需要 GitHub OIDC token
    permissions:
      contents: read
      id-token: write

    # 若在 nuget.org 的 Trusted Publishing 策略里填了 Environment，
    # 请取消下面这行的注释，并保证名称与策略中完全一致。
    # environment: production

    steps:
      - name: 检出（需要完整历史与 tag 供 MinVer 计算版本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          # 让后续步骤能在 PATH 上找到 dotnet-ef，否则冒烟测试会静默跳过迁移校验
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 校验触发方式（必须是 v* 标签）
        shell: bash
        run: |
          ref="${{ inputs.tag || github.ref }}"
          if [[ ! "$ref" =~ ^(refs/tags/)?v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::发布只能由 v* 标签触发，或手动指定一个已存在的 v* 标签；收到: $ref"
            exit 1
          fi

      # ---- 质量门禁：冒烟测试（含打包）不过则不发布 ----
      # smoke-test.ps1 会：打包三个包到 local-feed → 安装模板 → 生成九层项目
      #                  → 编译 → 跑测试 → 生成迁移 → 校验迁移与模型一致
      - name: 冒烟测试（含打包到 local-feed）
        run: pwsh ./build/smoke-test.ps1

      - name: 包内容安检（禁止配置/证书/密钥混入包）
        run: pwsh ./build/check-packages.ps1

      - name: 包安检规则自测（防止规则静默失效）
        run: pwsh ./build/test-check-packages.ps1

      - name: 列出待发布的包
        run: ls -l local-feed/*.nupkg

      # ---- 用 OIDC token 换取临时 API Key ----
      # 临时 Key 仅 1 小时有效、且一个 token 只能换一次，必须紧邻 push 执行。
      - name: NuGet 登录（OIDC → 临时 API Key）
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org 的用户名（profile name），不是邮箱；请在仓库 Secrets 中配置
          user: ${{ secrets.NUGET_USER }}

      - name: 校验待发布包的版本与标签一致
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          $packages = @(Get-ChildItem local-feed -Filter *.nupkg -File)
          if ($packages.Count -eq 0) { throw 'local-feed 里没有待发布的包' }
          $packages | ForEach-Object { Write-Host "  待发布: $($_.Name)" }
          $bad = @($packages | Where-Object { $_.Name -notlike "*$tag.nupkg" })
          if ($bad.Count -gt 0) {
            throw "以下包版本与标签 $tag 不一致：$($bad.Name -join ', ') —— 拒绝发布"
          }
          Write-Host "全部包版本与标签 $tag 一致 ✅"
      - name: 推送到 nuget.org
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 关键：显式检查文件数量。否则通配符匹配不到任何文件时循环会被整体跳过，
          # 导致这一步“绿色通过”却一个包都没发布。
          files=(local-feed/*.nupkg local-feed/*.snupkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::local-feed 中没有任何待发布的包，发布中止"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "==> 推送 $file"
            dotnet nuget push "$file" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "==> 已尝试推送 ${#files[@]} 个文件"

      - name: 校验已发布（轮询包索引，未出现即失败）
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          $urls = @(
            'https://api.nuget.org/v3-flatcontainer/cloudl.core/index.json',
            'https://api.nuget.org/v3-flatcontainer/cloudl.templates/index.json'
          )
          foreach ($url in $urls) {
            $found = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $index = Invoke-RestMethod -Uri $url -TimeoutSec 30
                if ($index.versions -contains $tag) { $found = $true; break }
              } catch { }
              Start-Sleep -Seconds 20
            }
            if (-not $found) {
              Write-Host "::error::$url 在 10 分钟内仍未出现版本 $tag —— 说明 push 步骤实际没有推送成功"
              exit 1
            }
            Write-Host "$url 已包含 $tag ✅"
          }
