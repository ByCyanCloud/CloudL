name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: 构建 / 测试 / 打包
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer 需要完整的 git 历史与 tag 才能算出正确版本
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore CloudL.slnx

      - name: 构建
        run: dotnet build CloudL.slnx -c Release --no-restore

      - name: 单元测试
        run: dotnet test CloudL.slnx -c Release --no-build

      - name: 安装 dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          # 让后续步骤能在 PATH 上找到 dotnet-ef，否则冒烟测试会静默跳过迁移校验
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 打包
        run: pwsh ./build/pack.ps1 -SkipTemplateInstall

      - name: 包内容安检（禁止配置/证书/密钥混入包）
        run: pwsh ./build/check-packages.ps1

      - name: 包安检规则自测（防止规则静默失效）
        run: pwsh ./build/test-check-packages.ps1

      - name: 依赖漏洞审计
        shell: bash
        run: |
          output=$(dotnet list CloudL.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "vulnerable packages"; then
            echo "::error::检测到存在已知漏洞的依赖，请升级后重试"
            exit 1
          fi

      - name: 模板冒烟测试（生成 → 编译 → 测试 → 迁移一致性）
        run: pwsh ./build/smoke-test.ps1 -SkipPack

      - name: 上传包产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudl-nupkg
          path: local-feed/*.nupkg
          if-no-files-found: error
