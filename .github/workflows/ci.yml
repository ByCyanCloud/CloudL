name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: 构建 / 测试 / 打包
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer 需要完整的 git 历史与 tag 才能算出正确版本
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore CloudL.slnx

      - name: 构建
        run: dotnet build CloudL.slnx -c Release --no-restore

      - name: 单元测试
        run: dotnet test CloudL.slnx -c Release --no-build

      - name: 安装 dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          # 让后续步骤能在 PATH 上找到 dotnet-ef，否则冒烟测试会静默跳过迁移校验
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 打包
        run: pwsh ./build/pack.ps1 -SkipTemplateInstall

      - name: 包内容安检（禁止配置/证书/密钥混入包）
        run: pwsh ./build/check-packages.ps1

      - name: 包安检规则自测（防止规则静默失效）
        run: pwsh ./build/test-check-packages.ps1

      - name: 依赖漏洞审计
        shell: pwsh
        run: |
          $output = & dotnet list CloudL.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          $lines = @(($output -split "`n") | Where-Object { $_ -match '\S' })
          $lines | ForEach-Object { Write-Host $_ }
          # 只认 GHSA 编号。注意：干净输出里的英文是 has no vulnerable packages —— 含 vulnerable 一词，
          # 按关键词判定会把"干净"误判成"有漏洞"（本步骤此前正是这样误报的）。
          $hits = @($lines | Where-Object { $_ -match 'GHSA-' })
          if ($hits.Count -gt 0) {
            Write-Host '::error::检测到已知漏洞依赖：'
            $hits | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host '无已知漏洞 ✅'
      - name: 诊断·漏洞审计原始输出（总是运行，失败时据此定位）
        if: always()
        shell: pwsh
        run: |
          $output = & dotnet list CloudL.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          $lines = @(($output -split "`n") | Where-Object { $_ -match '\S' } | Select-Object -First 40)
          $lines | ForEach-Object { Write-Host $_ }
          $flat = ($lines -join '%0A')
          Write-Host "::warning::漏洞审计原始输出：$flat"
      - name: 模板冒烟测试（生成 → 编译 → 测试 → 迁移一致性）
        run: pwsh ./build/smoke-test.ps1 -SkipPack

      - name: 上传包产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudl-nupkg
          path: local-feed/*.nupkg
          if-no-files-found: error
